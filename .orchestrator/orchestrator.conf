# Shared by Claude Code and Codex: read by the scripts and hooks in .orchestrator/ and by the pre-pr-review skill.
# REPOS: space-separated directories under the workspace root ("." = the root itself).
REPOS="."
# The orchestrator-setup release this workspace was scaffolded or last updated with (CHANGELOG.md of the skill
# says what changed since). Absent: set up before v0.1.0, when everything lived under .claude/.
TEMPLATE_VERSION="0.1.0"
# Each repo's base branch, as space-separated <repo>=<branch>. memory-state.sh reports its last commit.
BASE_BRANCHES=".=main"
# Words the four memory files may hold together before memory-check warns.
WORD_BUDGET=1200
# Optional: a wrapper that runs git with the right credentials, called as "<wrapper> <repo> <git args>".
GIT_WRAPPER=".orchestrator/scripts/gh-git.sh"
# "no": the orchestration layer is not versioned; /sync-memory skips its commit step.
ROOT_GIT="yes"
# Optional: a regex every PR body must match (e.g. '^Jira: KAN-[0-9]+'); push-pr.sh refuses a body without it.
TICKET_LINE=""
# Optional, for the SessionStart decision index: a directory with one markdown file per ADR, and a
# decision log whose entries are "## " headings with a "**Status:**" line. Paths relative to the root.
# "strict": pre-pr-pass.sh refuses a branch where a feat/fix commit has no test commit before it (TDD).
# "off": no check. A single branch skips it with TDD_EXEMPT="<reason>" pre-pr-pass.sh <repo> <branch>.
TDD="strict"
# Optional: the repos the TDD check applies to (space-separated); empty means all. Leave out a repo with no tests.
TDD_REPOS=""
# Optional: check only commits made from this moment on ("YYYY-MM-DD" = its midnight, or "YYYY-MM-DD HH:MM"),
# when adopting TDD with branches already open.
TDD_SINCE=""
ADR_DIR=""
DECISION_LOG=""
# Repos with a user interface: the pre-pr-review skill adds the UI group (item 14) for them. Keep in step with
# UI_REPOS in .claude/workflows/pre-pr-review.js.
UI_REPOS=""
# Skills in .agents/skills that sync-skills.sh does not copy to .claude/skills (Claude Code has its own equivalent).
CODEX_ONLY_SKILLS="pre-pr-review"
